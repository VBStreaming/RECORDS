<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/records-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>RECORDS · 과제 플래너</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const firebaseConfig = {
            apiKey: "%VITE_FIREBASE_API_KEY%",
            projectId: "%VITE_FIREBASE_PROJECT_ID%",
            messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
            appId: "%VITE_FIREBASE_APP_ID%",
          };
          const configured = Object.values(firebaseConfig).every((value) => value && !value.startsWith("%"));
          const query = configured ? `?${new URLSearchParams(firebaseConfig)}` : "";
          navigator.serviceWorker.register(`/sw.js${query}`).catch(() => undefined);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
