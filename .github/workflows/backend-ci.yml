name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: records
          POSTGRES_USER: records
          POSTGRES_PASSWORD: records
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U records -d records"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+psycopg://records:records@localhost:5432/records
      TEST_DATABASE_URL: postgresql+psycopg://records:records@localhost:5432/records_test

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create virtual environment
        run: make venv PYTHON=python

      - name: Create test database
        run: >-
          .venv/bin/python -c
          "import psycopg;
          connection = psycopg.connect('postgresql://records:records@localhost:5432/records', autocommit=True);
          connection.execute('CREATE DATABASE records_test');
          connection.close()"

      - name: Run quality gate
        run: make check
