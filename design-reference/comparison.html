<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECORDS Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: #f4f2ec; background: #0c0d0f; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 22px; font-size: 22px; }
      h1 span { color: #ff7a45; }
      main { display: grid; grid-template-columns: 1fr 393px; gap: 22px; align-items: start; }
      section { overflow: hidden; border: 1px solid #292c30; border-radius: 18px; background: #151719; }
      header { padding: 12px 15px; color: #94989b; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
      img { display: block; width: 100%; height: auto; }
      .source { display: grid; gap: 22px; }
      .implementation img { width: 393px; }
    </style>
  </head>
  <body>
    <h1>RECORDS<span>.</span> — Pinterest reference / implementation</h1>
    <main>
      <div class="source">
        <section><header>SOURCE 01 · DARK CALENDAR DETAIL</header><img src="/design-reference/pinterest-dark-calendar-detail.png" alt="Pinterest dark calendar reference" /></section>
        <section><header>SOURCE 02 · MOBILE PLANNER SEARCH</header><img src="/design-reference/pinterest-mobile-planner-results.png" alt="Pinterest mobile planner references" /></section>
      </div>
      <div class="implementation">
        <section><header>IMPLEMENTATION · DASHBOARD</header><img src="/design-reference/implementation-records-mobile.png" alt="Records dashboard" /></section>
        <section><header>IMPLEMENTATION · QUICK ADD</header><img src="/design-reference/implementation-add-task-sheet.png" alt="Records quick add sheet" /></section>
      </div>
    </main>
  </body>
</html>
