services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: records
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U records -d records"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
